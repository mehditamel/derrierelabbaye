name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

# Annule les exécutions précédentes encore en cours sur la même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format (Prettier)
        run: npm run format:check

      # Le script lance `next typegen` avant tsc : `next-env.d.ts` (types des
      # images importées) et les types de routes sont générés, pas versionnés.
      # `next lint` les produisait avant sa suppression en Next 16 ; l'ESLint CLI
      # ne le fait pas, et tsc échouait donc sur un dépôt fraîchement cloné.
      - name: Type-check
        run: npm run type-check

      - name: Tests (avec couverture)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Audit Lighthouse — bloquant sur a11y et best-practices partout, sur le SEO
  # des seules pages publiques (la coque PWA /app est volontairement noindex,
  # cf. .lighthouserc.json) ; la performance reste informative, trop volatile
  # sur runner partagé. Agrégation sur la médiane des 3 runs, explicitement :
  # par défaut LHCI retient le MEILLEUR run, ce qui suffirait à passer sur un
  # coup de chance.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npx @lhci/cli@0.14.x autorun
